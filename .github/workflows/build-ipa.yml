name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Picking Xcode: $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Show workspaces and schemes
        run: |
          xcodebuild -list -workspace KeePassium.xcworkspace

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace KeePassium.xcworkspace \
            -scheme KeePassium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/KeePassium.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log | xcpretty || true
          if [ ! -d "$PWD/build/KeePassium.xcarchive/Products/Applications" ]; then
            echo "::error::Archive failed, see build.log"
            tail -n 200 build.log
            exit 1
          fi

      - name: Assemble Payload and zip IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/KeePassium.xcarchive/Products/Applications/KeePassium.app" build/Payload/
          (cd build && zip -qry KeePassium-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-unsigned-ipa
          path: build/KeePassium-unsigned.ipa
